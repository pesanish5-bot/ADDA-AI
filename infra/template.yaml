AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: ADDA AI API with private, short-lived document evidence storage.
Parameters:
  AppEnv:
    Type: String
    Default: staging
    AllowedValues: [development, staging, production]
    Description: Runtime environment. production refuses the demo fixture unless AllowDemoFixture=true.
  AllowDemoFixture:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  FrontendOrigin:
    Type: String
    AllowedPattern: 'https://[^/]+|http://localhost:3000'
    Description: Exact frontend origin without trailing slash.
  AppEnv:
    Type: String
    Default: staging
    AllowedValues: [development, staging, production]
    Description: Runtime environment label. production refuses the demo fixture unless AllowDemoFixture=true.
  Provider:
    Type: String
    Default: demo
    AllowedValues: [demo, bedrock]
  AllowDemoFixture:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Permit the labelled fixture in production for a deliberate smoke stage only.
  BedrockModelId:
    Type: String
    Default: ''
    Description: Account-accessible Converse model or inference profile ID.
  DemoAccessToken:
    Type: String
    NoEcho: true
    Default: ''
    MinLength: 0
    Description: Optional shared demo gate. Leave empty for a public hackathon demo. Never put in frontend build variables.
  TavilyApiKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: Optional backend-only Search API key.
Conditions:
  UseBedrock: !Equals [!Ref Provider, bedrock]
Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      DefaultRouteSettings:
        ThrottlingBurstLimit: 5
        ThrottlingRateLimit: 2
  Api:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../services/api/
      Handler: app.main.handler
      Runtime: python3.13
      MemorySize: 512
      Timeout: 28
      Environment:
        Variables:
          APP_ENV: !Ref AppEnv
          ALLOW_DEMO_FIXTURE: !Ref AllowDemoFixture
          NEXUS_PROVIDER: !Ref Provider
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          ALLOWED_ORIGINS: !Ref FrontendOrigin
          DEMO_ACCESS_TOKEN: !Ref DemoAccessToken
          TAVILY_API_KEY: !Ref TavilyApiKey
          DOCUMENT_ENABLED: 'true'
          DOCUMENT_BUCKET: !Ref DocumentsBucket
      Policies:
        - Statement:
            - Effect: Allow
              Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
              Resource: !Sub '${DocumentsBucket.Arn}/documents/*'
            - Effect: Allow
              Action: [s3:ListBucket]
              Resource: !GetAtt DocumentsBucket.Arn
        - !If
          - UseBedrock
          - Statement:
              - Effect: Allow
                Action: [bedrock:InvokeModel]
                Resource:
                  - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/*'
                  - !Sub 'arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/*'
          - !Ref AWS::NoValue
      Events:
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /
            Method: ANY
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY
  DocumentsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireDocumentEvidence
            Status: Enabled
            Prefix: documents/
            ExpirationInDays: 1
Outputs:
  ApiUrl:
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
  DocumentsBucketName:
    Description: Private extracted document evidence with one-day object expiry.
    Value: !Ref DocumentsBucket
